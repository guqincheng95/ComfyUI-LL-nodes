name: LL node library tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  metadata-and-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -p test_resolution.py -v
      - run: python -m unittest discover -s tests -p test_library.py -v
      - run: node tests/frontend.test.mjs
      - run: node tests/subject_frontend.test.mjs
      - run: python -m compileall -q __init__.py modules scripts tests
  photo-ui-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/photo_layout.browser.mjs
  image-algorithms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy pillow scipy
      - run: python -m unittest discover -s tests -v
